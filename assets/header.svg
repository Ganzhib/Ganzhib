<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Hi, I'm Ganzhibin.</title>
  <desc id="description">Full stack developer and AI builder. From an idea to something useful.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111d27"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#46d9ba" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#46d9ba" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#86a1b4" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="20" fill="url(#background)"/>
  <rect x="650" y="1" width="549" height="358" rx="20" fill="url(#grid)"/>
  <ellipse cx="935" cy="170" rx="320" ry="240" fill="url(#glow)"/>
  <rect x="0.5" y="0.5" width="1199" height="359" rx="20" fill="none" stroke="#283b48"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
    <rect x="56" y="40" width="32" height="32" rx="10" fill="#64e3c1"/>
    <text x="72" y="62" text-anchor="middle" font-size="21" font-weight="750" fill="#0b181a">g</text>
    <text x="101" y="61" font-size="13" letter-spacing="3" fill="#a6bac7">GANZHIB / GITHUB</text>

    <text x="56" y="132" font-size="30" fill="#b8c9d5">Hi, I'm</text>
    <text x="52" y="214" font-size="84" font-weight="750" letter-spacing="-3" fill="#f0f6fc">Ganzhibin<tspan fill="#64e3c1">.</tspan></text>
    <text x="58" y="256" font-size="14" letter-spacing="2.5" fill="#64e3c1">FULL STACK DEVELOPER / AI BUILDER</text>
    <text x="58" y="313" font-size="17" fill="#92a9b9">From an idea to something useful.</text>
  </g>

  <g transform="translate(716 62)">
    <rect x="-12" y="18" width="404" height="228" rx="15" fill="#14262c" stroke="#28453f" transform="rotate(-4 190 130)"/>
    <rect width="404" height="228" rx="15" fill="#111b25" stroke="#38545c"/>
    <path d="M0 45H404" stroke="#293b46"/>
    <circle cx="23" cy="23" r="4.5" fill="#f48383"/>
    <circle cx="39" cy="23" r="4.5" fill="#edc982"/>
    <circle cx="55" cy="23" r="4.5" fill="#64d8b3"/>
    <text x="202" y="28" text-anchor="middle" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#7f99aa">a-little-about-me.ts</text>

    <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="16">
      <g fill="#415665" text-anchor="end">
        <text x="32" y="83">1</text>
        <text x="32" y="111">2</text>
        <text x="32" y="139">3</text>
        <text x="32" y="167">4</text>
        <text x="32" y="195">5</text>
