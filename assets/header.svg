      <text x="70" y="111" fill="#d4e3ee">mindset: <tspan fill="#8bd8b3">"stay curious"</tspan>,</text>
      <text x="70" y="139" fill="#d4e3ee">tools: [<tspan fill="#8bd8b3">"code"</tspan>, <tspan fill="#8bd8b3">"AI"</tspan>],</text>
      <text x="70" y="167" fill="#d4e3ee">goal: <tspan fill="#8bd8b3">"make it useful"</tspan></text>
