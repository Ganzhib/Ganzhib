<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title description">
  <title id="title">Ganzhibin — Full Stack × AI × Product</title>
  <desc id="description">Ideas. Systems. Products. Building agent systems and software across desktop, web and mobile.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#080e19"/><stop offset="1" stop-color="#0c1524"/></linearGradient>
    <radialGradient id="atmosphere"><stop stop-color="#2563eb" stop-opacity=".29"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient>
    <radialGradient id="sphere" cx=".3" cy=".22" r=".85">
      <stop stop-color="#6affdf"/><stop offset=".25" stop-color="#1bada6"/><stop offset=".6" stop-color="#145d82"/><stop offset="1" stop-color="#0a132a"/>
    </radialGradient>
    <linearGradient id="orbit"><stop stop-color="#56e6c0" stop-opacity=".1"/><stop offset=".5" stop-color="#7bdcff"/><stop offset="1" stop-color="#6382ff" stop-opacity=".15"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8caad6" stroke-opacity=".055"/></pattern>
    <clipPath id="bounds"><rect width="1200" height="470" rx="22"/></clipPath>
  </defs>
  <style>
    .signal { stroke-dasharray: 3 12; animation: transmit 18s linear infinite; }
    @keyframes transmit { to { stroke-dashoffset: -300; } }
    @media (prefers-reduced-motion: reduce) { .signal { animation: none; } }
  </style>
  <g clip-path="url(#bounds)">
    <rect width="1200" height="470" fill="url(#background)"/>
    <rect width="1200" height="470" fill="url(#grid)"/>
    <ellipse cx="965" cy="195" rx="390" ry="330" fill="url(#atmosphere)"/>
    <path d="M660 0L560 470" stroke="#7f9ac5" stroke-opacity=".1"/>
    <path d="M690 0L590 470" stroke="#7f9ac5" stroke-opacity=".04"/>
    <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif">
      <rect x="50" y="36" width="31" height="31" rx="9" fill="#6af0ce"/>
      <text x="65.5" y="58" font-size="23" font-weight="750" text-anchor="middle" fill="#09151a">g</text>
      <text x="95" y="57" font-size="12" letter-spacing="2.8" fill="#a8bacf">FULL STACK × AI × PRODUCT</text>
      <text x="49" y="165" font-size="89" font-weight="800" letter-spacing="-4.5" fill="#f3f7ff">Ganzhibin<tspan fill="#6af0ce">.</tspan></text>
      <text x="53" y="230" font-size="40" font-weight="650" letter-spacing="-1" fill="#f3f7ff">Ideas. Systems.</text>
      <text x="53" y="280" font-size="40" font-weight="650" letter-spacing="-1" fill="#6af0ce">Products.</text>
      <text x="55" y="328" font-size="17" fill="#94a7c1">Engineering the whole experience.</text>
      <path d="M54 378H1146" stroke="#33445b" stroke-opacity=".65"/>
      <g font-size="12" letter-spacing="1.7">
        <text x="55" y="417" fill="#6af0ce">01</text><text x="88" y="417" fill="#adbed2">AGENT SYSTEMS</text>
        <text x="416" y="417" fill="#6af0ce">02</text><text x="449" y="417" fill="#adbed2">CROSS-PLATFORM</text>
        <text x="809" y="417" fill="#6af0ce">03</text><text x="842" y="417" fill="#adbed2">PRODUCT ENGINEERING</text>
      </g>
    </g>
    <g transform="translate(919 209)">
      <circle r="132" fill="none" stroke="#6580b4" stroke-opacity=".1"/>
      <circle r="106" fill="none" stroke="#6580b4" stroke-opacity=".14" stroke-dasharray="2 9"/>
      <ellipse rx="192" ry="67" transform="rotate(-29)" fill="none" stroke="url(#orbit)" stroke-width="1.5"/>
      <ellipse rx="178" ry="71" transform="rotate(38)" fill="none" stroke="#5888bb" stroke-opacity=".28"/>
      <circle r="76" fill="url(#sphere)" stroke="#79ead4" stroke-opacity=".2"/>
      <ellipse rx="76" ry="26" transform="rotate(-29)" fill="none" stroke="#b3ffed" stroke-opacity=".18"/>
      <ellipse rx="30" ry="76" transform="rotate(-29)" fill="none" stroke="#b3ffed" stroke-opacity=".14"/>
      <ellipse rx="192" ry="67" transform="rotate(-29)" fill="none" stroke="#9afce5" stroke-width="2" class="signal"/>
      <circle cx="-150" cy="92" r="5" fill="#83ffdb"/><circle cx="150" cy="-90" r="5" fill="#9eaaff"/>
      <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11" letter-spacing="1">
        <rect x="-200" y="-107" width="97" height="28" rx="7" fill="#101e30" stroke="#2c415d"/>
        <text x="-151.5" y="-89" text-anchor="middle" fill="#b9cbe5">CONTEXT</text>
        <rect x="91" y="79" width="91" height="28" rx="7" fill="#101e30" stroke="#2c415d"/>
        <text x="136.5" y="97" text-anchor="middle" fill="#b9cbe5">TOOLS</text>
        <text x="0" y="-5" text-anchor="middle" fill="#efffff" font-size="15" font-weight="700" letter-spacing="4">AGENT</text>
        <text x="0" y="17" text-anchor="middle" fill="#c2f6ef" font-size="10" letter-spacing="2">RUNTIME</text>
        <text x="0" y="153" text-anchor="middle" fill="#6884ab" font-size="10" letter-spacing="3">LOCAL FIRST / MULTI SURFACE</text>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="1199" height="469" rx="22" fill="none" stroke="#29384f"/>
</svg>
