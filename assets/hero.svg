<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title description">
  <title id="title">Ganzhibin — Full Stack × AI × Product</title>
  <desc id="description">Ideas. Systems. Products. A light blue and cyan orbital illustration connects context, tools and memory around an agent runtime.</desc>
