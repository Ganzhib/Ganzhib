<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="310" viewBox="0 0 1200 310" role="img" aria-labelledby="title description">
  <title id="title">catbuddy — One Runtime. Every Screen.</title>
  <desc id="description">A desktop-first AI coding assistant. Desktop, web and mobile connect to a local agent runtime through platform-specific transports.</desc>
